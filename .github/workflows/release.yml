name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
        type: string
      publish:
        description: "输入 y 跳过发布 Release，留空则发布"
        required: false
        default: ""
        type: string
      play:
        description: "输入 y 跳过 Play Bundle，留空则构建"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status

      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: ${{ runner.os }}-libcore-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: libcore/go.sum

      - name: Set up Android SDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;29.0.14206865"

      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core

      - name: Verify LibCore
        run: |
          if [ ! -s app/libs/libcore.aar ]; then
            echo "::error::app/libs/libcore.aar 不存在或为空"
            exit 1
          fi

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status

      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: ${{ runner.os }}-libcore-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
          fail-on-cache-miss: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-oss-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-oss-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.1.0"

      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./run init action gradle
          ./gradlew app:assembleOssRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts/apks

          find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -exec cp -v {} artifacts/apks/ \;

          if ! find artifacts/apks -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error::没有找到生成的 APK 文件"
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: artifacts/apks/*.apk
          if-no-files-found: error

  publish:
    name: Publish Release
    if: github.event.inputs.publish != 'y'
    runs-on: ubuntu-latest
    needs:
      - build

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          wget -O ghr.tar.gz \
            https://github.com/tcnksm/ghr/releases/download/v0.13.0/ghr_v0.13.0_linux_amd64.tar.gz

          tar -xvf ghr.tar.gz
          mv ghr*linux_amd64/ghr .

          mkdir -p apks
          find artifacts -type f -name "*.apk" -exec cp -v {} apks/ \;

          if ! find apks -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error::没有找到可发布的 APK 文件"
            exit 1
          fi

          ./ghr \
            -delete \
            -t "$GITHUB_TOKEN" \
            -n "$RELEASE_TAG" \
            "$RELEASE_TAG" \
            apks

  play:
    name: Build Play Bundle
    if: github.event.inputs.play != 'y'
    runs-on: ubuntu-latest
    needs:
      - libcore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status

      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: ${{ runner.os }}-libcore-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
          fail-on-cache-miss: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-play-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-play-

      - name: Checkout Library
        run: git submodule update --init 'app/*'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.1.0"

      - name: Gradle Build
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./run init action gradle
          ./gradlew bundlePlayRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AAB
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
